<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survey builder - requests_to_twilio</title>
<!--
  The survey builder. One file, opened from disk: no server, no network, no
  Twilio credentials. It edits a survey spec's canonical JSON - the same file
  `rtt survey convert` writes - and `rtt survey check` stays the authoritative
  check. The limits below come from the Python side through the rtt-contract
  block, which `just dev builder-sync` rewrites and a test compares.
-->
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --ink: #1d2433; --muted: #6b7385; --line: #e2e5ea;
    --accent: #4f46e5; --accent-soft: #eef0ff; --bad: #d92d20; --bad-soft: #fdecea;
    --warn: #b54708; --warn-soft: #fff4e5; --ok: #067647;
    --k-text: #0284c7; --k-integer: #7c3aed; --k-decimal: #7c3aed; --k-select_button: #059669;
    --k-select_list: #0d9488; --k-template: #d97706; --k-note: #64748b; --k-close: #be123c;
    --k-group: #4f46e5; --k-consent: #db2777; --k-unsolicited: #94a3b8;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-size: 14px; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); border-radius: 6px; padding: 5px 10px; }
  button:hover { border-color: #c5cad3; background: #fafbfc; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #4338ca; }
  button.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 3px 6px; }
  button.ghost:hover { color: var(--ink); background: #eef0f3; }
  input, textarea, select { font: inherit; color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 8px; background: #fff; width: 100%; }
  textarea { resize: vertical; min-height: 64px; line-height: 1.4; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .invalid { border-color: var(--bad) !important; background: var(--bad-soft); }
  code, .mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12.5px; }

  header.bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .brand { font-weight: 700; letter-spacing: .2px; }
  .brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
  .file { color: var(--muted); display: flex; gap: 6px; align-items: center; min-width: 0; }
  .file b { color: var(--ink); font-weight: 600; }
  .dirty { color: var(--warn); font-size: 12px; }
  .spacer { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 5px 10px; }
  .seg button.on { background: var(--accent); color: #fff; }
  .issues-btn.has { background: var(--bad-soft); border-color: #f5c2bd; color: var(--bad); }
  .issues-btn.none { color: var(--ok); }

  main.layout { display: grid; grid-template-columns: minmax(300px, 360px) minmax(420px, 1fr) 360px;
    gap: 14px; padding: 14px; align-items: start; }
  @media (max-width: 1250px) { main.layout { grid-template-columns: minmax(420px, 1fr) 340px; }
    .map-pane { grid-column: 1 / -1; position: static !important; max-height: none !important; } }
  .pane { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .map-pane, .preview-pane { position: sticky; top: 62px; max-height: calc(100vh - 76px); overflow: auto; }
  .pane-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px;
    color: var(--muted); padding: 10px 12px 6px; display: flex; justify-content: space-between; align-items: center; }
  #map { padding: 0 8px 10px; overflow: auto; }
  #map svg text { font-family: "Segoe UI", system-ui, sans-serif; }
  .map-node { cursor: pointer; }
  .map-node:hover rect.box { stroke-width: 2; }

  .cards-pane { min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--kc, #999);
    border-radius: 10px; margin: 0; }
  .card.sel { box-shadow: 0 0 0 2px var(--accent); }
  .card.dragging { opacity: .45; }
  .card-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer; user-select: none; }
  .handle { cursor: grab; color: #a0a7b4; padding: 0 2px; font-size: 16px; line-height: 1; }
  .stepno { font-size: 11px; color: var(--muted); background: #f0f2f5; border-radius: 4px; padding: 1px 6px; }
  .kind { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--kc); }
  .rname { font-weight: 600; }
  .summary { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .badge { font-size: 11px; border-radius: 10px; padding: 1px 7px; background: #f0f2f5; color: var(--muted); white-space: nowrap; }
  .badge.bad { background: var(--bad-soft); color: var(--bad); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .head-tools { display: flex; gap: 2px; }
  .card-body { padding: 4px 14px 14px; border-top: 1px dashed var(--line); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .fld { margin-top: 10px; }
  .fld > label, .fld-label { display: flex; justify-content: space-between; gap: 8px; font-size: 12px;
    font-weight: 600; color: #3f4756; margin-bottom: 4px; }
  .hint { font-size: 12px; color: var(--muted); font-weight: 400; }
  .count { font-size: 11px; color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
  .count.over { color: var(--bad); font-weight: 700; }
  .langs-row { display: grid; gap: 10px; grid-template-columns: repeat(var(--nl, 1), 1fr); }
    .checks { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; }
  .checks label { display: flex; gap: 6px; align-items: center; font-size: 13px; cursor: pointer; }
  .checks input { width: auto; }
  details.more { margin-top: 10px; }
  details.more > summary { cursor: pointer; color: var(--muted); font-size: 12px; font-weight: 600; }
  .note-box { font-size: 12.5px; color: #4b5563; background: #f7f8fa; border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; margin-top: 10px; line-height: 1.45; white-space: pre-line; }
  .note-box.info { background: var(--accent-soft); border-color: #d9dcff; color: #3730a3; }

  .cond { margin-top: 12px; padding: 10px 12px; border-radius: 8px; border: 1px dashed #c7cbf5; background: #fafaff; }
  .cond.on { border: 1px solid #a5abf2; background: var(--accent-soft); }
  .cond .fld-label { font-size: 13px; color: #312e81; }
  .cond-badge { background: var(--accent-soft); color: #3730a3; font-weight: 600; }
  .choices { margin-top: 10px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .choices-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px;
    background: #f7f8fa; border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 600; }
  .choice { display: grid; grid-template-columns: 70px 1fr auto; gap: 8px; padding: 8px 10px;
    border-bottom: 1px solid var(--line); align-items: start; }
  .choice:last-child { border-bottom: 0; }
  .choice .sub { grid-column: 2 / 3; }
  .choice-tools { display: flex; gap: 2px; }

  .insert { display: flex; align-items: center; gap: 8px; height: 22px; margin: 2px 0; opacity: .0; transition: opacity .12s; }
  .insert:hover, .insert.open, .insert.drop { opacity: 1; }
  .insert::before, .insert::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .insert.drop::before, .insert.drop::after { height: 3px; background: var(--accent); }
  .insert button { font-size: 12px; padding: 1px 8px; color: var(--accent); border-color: #d9dcff; background: var(--accent-soft); }
  .menu { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; margin: 2px 0 6px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; }
  .menu button { font-size: 12.5px; }
  .menu button .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

  .phone { margin: 4px 12px 12px; border-radius: 22px; border: 8px solid #1f2328; overflow: hidden; background: #efe7dd; }
  .phone-top { background: #075e54; color: #fff; padding: 9px 12px; font-weight: 600; font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .phone-top .avatar { width: 26px; height: 26px; border-radius: 50%; background: #d7ece9; color: #075e54;
    display: grid; place-items: center; font-weight: 700; font-size: 12px; }
  .chat { padding: 12px 10px 16px; min-height: 260px; display: flex; flex-direction: column; gap: 6px; }
  .bubble { background: #fff; border-radius: 8px; border-top-left-radius: 0; padding: 7px 9px 5px; max-width: 92%;
    box-shadow: 0 1px .5px rgba(0,0,0,.13); font-size: 13.5px; line-height: 1.38; word-wrap: break-word; }
  .bubble .time { display: block; text-align: right; color: #8696a0; font-size: 10.5px; margin-top: 2px; }
  .bubble.sys { background: #fdf6d8; color: #54470f; align-self: center; border-radius: 8px; font-size: 12.5px; text-align: center; max-width: 100%; }
  .wa-btn { background: #fff; border-radius: 8px; padding: 8px; text-align: center; color: #027eb5; font-size: 13.5px;
    max-width: 92%; box-shadow: 0 1px .5px rgba(0,0,0,.13); }
  .wa-btn.over { color: var(--bad); text-decoration: line-through; }
  .wa-list-btn { border-top: 1px solid #e9edef; margin: 6px -9px -5px; padding: 8px; text-align: center; color: #027eb5; }
  .sheet { background: #fff; border-radius: 12px; margin-top: 8px; box-shadow: 0 -1px 6px rgba(0,0,0,.12); overflow: hidden; }
  .sheet-title { text-align: center; font-weight: 600; padding: 8px; border-bottom: 1px solid #e9edef; font-size: 13px; }
  .sheet-row { padding: 7px 12px; border-bottom: 1px solid #f0f2f5; display: flex; justify-content: space-between; gap: 8px; }
  .sheet-row:last-child { border-bottom: 0; }
  .sheet-row small { display: block; color: #667781; font-size: 12px; }
  .radio { width: 16px; height: 16px; border: 2px solid #8696a0; border-radius: 50%; flex: none; margin-top: 2px; }
  .var { background: #e7f0ff; color: #1d4ed8; border-radius: 3px; padding: 0 3px; font-family: Consolas, monospace; font-size: 12px; }
  .facts { margin: 0 12px 12px; font-size: 12.5px; color: #3f4756; line-height: 1.5; }
  .facts dt { font-weight: 700; margin-top: 6px; }
  .facts dd { margin: 0; color: var(--muted); }
  .codes { border-collapse: collapse; width: 100%; margin-top: 2px; }
  .codes td { border-top: 1px solid var(--line); padding: 2px 4px; }
  #issues { margin: 0 12px 12px; }
  .issue { font-size: 12.5px; padding: 6px 8px; border-radius: 6px; margin-top: 4px; cursor: pointer; line-height: 1.35; }
  .issue.error { background: var(--bad-soft); color: #912018; }
  .issue.warn { background: var(--warn-soft); color: #93370d; }
  .issue .act { margin-left: 8px; font-size: 12px; padding: 1px 8px; }
  .approved { margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: #f6fbf7; }
  .approved-body { font-size: 13px; white-space: pre-wrap; line-height: 1.4; }
  .approved-buttons { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .approved-buttons span { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; color: #027eb5; font-size: 12.5px; }
  .approved-var { display: grid; grid-template-columns: auto auto minmax(120px, 1fr) auto; gap: 8px; align-items: center; margin-top: 8px; font-size: 12.5px; }
  .tools { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; align-items: center; }
  .tools button, .tools select { font-size: 12px; padding: 2px 8px; width: auto; }
  .palette { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .palette button { font-size: 17px; padding: 2px 5px; border-color: transparent; background: transparent; }
  .replies { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #1f2328; color: #fff;
    padding: 9px 14px; border-radius: 8px; font-size: 13px; z-index: 50; display: flex; gap: 12px; align-items: center;
    box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  .toast.error { background: #912018; }
  .toast button { background: transparent; color: #c7d2fe; border-color: #4b5563; padding: 2px 8px; }
  .welcome { margin-bottom: 10px; }
</style>
</head>
<body>
<header class="bar">
  <div class="brand">Survey builder<small>requests_to_twilio</small></div>
  <div class="file"><b id="file-name">untitled.json</b><span id="dirty" class="dirty"></span></div>
  <button id="btn-new" title="Start from the documented example">New</button>
  <button id="btn-open" title="Open a survey spec (.json)">Open...</button>
  <button id="btn-save" class="primary" title="Save (Ctrl+S)">Save</button>
  <button id="btn-saveas">Save as...</button>
  <button id="btn-undo" class="ghost" title="Undo (Ctrl+Z)">&#8630; Undo</button>
  <button id="btn-redo" class="ghost" title="Redo (Ctrl+Y)">&#8631; Redo</button>
  <div class="spacer"></div>
  <span class="hint" id="langs-label">Language</span><div class="seg" id="langs"></div>
  <button id="btn-copy" title="Copy the commands that check this file, build the flow and deploy it as a draft">Copy deploy commands</button>
  <button id="btn-issues" class="issues-btn">0 issues</button>
</header>

<main class="layout">
  <aside class="pane map-pane">
    <div class="pane-title"><span>Flow map</span><span class="hint" id="map-meta"></span></div>
    <div id="map"></div>
  </aside>
  <section class="cards-pane">
    <div id="cards"></div>
  </section>
  <aside class="pane preview-pane">
    <div class="pane-title"><span>How it looks on the phone</span><span class="hint" id="preview-meta"></span></div>
    <div id="phone"></div>
    <div class="pane-title" id="issues-title"><span>To fix</span></div>
    <div id="issues"></div>
  </aside>
</main>
<input type="file" id="file-input" accept=".json,application/json" hidden>

<script type="application/json" id="rtt-contract">
{
  "limits": {
    "list-picker:body": 1024,
    "list-picker:item": 24,
    "list-picker:description": 72,
    "list-picker:id": 200,
    "quick-reply:title": 25,
    "list_button": 20,
    "button_title": 20,
    "max_list_items": 10,
    "max_session_buttons": 3
  },
  "question_types": [
    "decimal",
    "integer",
    "numeric",
    "select_button",
    "select_list",
    "template",
    "text"
  ],
  "constrained_types": [
    "decimal",
    "integer",
    "numeric"
  ],
  "structure_types": [
    "begin group",
    "end group",
    "note"
  ],
  "type_aliases": {
    "numeric": "integer"
  },
  "roles": [
    "",
    "close",
    "consent",
    "intro",
    "unsolicited"
  ],
  "outcomes": [
    "complete",
    "declined",
    "incomplete",
    "unreachable",
    "undeliverable",
    "optout"
  ],
  "default_constraints": {
    "integer": "(?:\\s*\\d+\\s*)",
    "decimal": "(?:\\s*\\d+(?:[.,]\\d+)?\\s*)"
  },
  "stop_word_scopes": [
    "opening_and_reminders",
    "opening",
    "never"
  ],
  "universal_stop_word": "stop",
  "reminder_message": "timeout_nudge",
  "range_message": "error_range",
  "default_reminder_after": 84600,
  "session_window": 86400,
  "emoji_ranges": [
    [
      127744,
      129791
    ],
    [
      9728,
      10175
    ],
    [
      65024,
      65039
    ],
    [
      8205,
      8205
    ],
    [
      11008,
      11263
    ]
  ],
  "scope_note": "This format describes a SURVEY: an instrument that asks a sampled person questions and expects a dataset out. It assumes consent is asked before any question, that every path publishes exactly one row per respondent, and that one execution is one person answering once.\n\nReminders, multi-wave interventions and notifications break those assumptions - they may send repeatedly to the same person, collect no answer, take consent at enrolment rather than in the message, or publish nothing. Those are not worse flows, they are a different shape. Build them as Studio flows and check them with `rtt flow check`, which judges a graph on its own terms.",
  "starter": {
    "settings": {
      "form_id": "my_survey",
      "form_title": "Replace this with what the round is called",
      "languages": [
        "en"
      ],
      "default_language": "en",
      "functions_service": "rtt-survey",
      "default_timeout": 3600,
      "default_retries": 2,
      "stop_words": "opening_and_reminders",
      "reminder_after": 84600,
      "publish_table": "",
      "preloads": [
        "caseid",
        "name",
        "sent_at"
      ],
      "flow_name": {
        "en": "my_survey"
      },
      "description": {
        "en": "One line saying what this round is for"
      }
    },
    "survey": [
      {
        "type": "template",
        "name": "intro",
        "role": "intro",
        "retries": 0,
        "template": {
          "en": "my_survey_intro"
        },
        "variables": {
          "1": "name"
        },
        "publish": false
      },
      {
        "type": "select_button consent",
        "name": "consent",
        "role": "consent",
        "label": {
          "en": "Before we start - would you like to take part?\n\nREPLACE THIS. It takes about N minutes. Taking part is voluntary, you can stop at any time, and your answers are confidential."
        },
        "retries": 1
      },
      {
        "type": "select_list frequency",
        "name": "Q1",
        "label": {
          "en": "Question 1 of 3\n\nA closed question. A tap cannot be malformed, so there is nothing to clean afterwards - prefer this shape."
        },
        "retries": 2
      },
      {
        "type": "integer",
        "name": "Q2",
        "label": {
          "en": "Question 2 of 3\n\nHow many? The reply is checked before it is stored, so 'about five' is re-asked rather than saved.\n\n_Reply with an exact number (e.g. 0, 3, 12)._"
        },
        "retries": 2,
        "constraint_message": "error_numeric"
      },
      {
        "type": "text",
        "name": "Q3",
        "label": {
          "en": "Question 3 of 3\n\nAn open question. Whatever arrives is stored, including an answer nobody can code - so use it only where the answer genuinely cannot be enumerated."
        },
        "retries": 0
      },
      {
        "type": "note",
        "name": "close_complete",
        "role": "close",
        "label": {
          "en": "Thank you for completing the survey."
        },
        "relevance": "${outcome}='complete'",
        "publish": false
      },
      {
        "type": "note",
        "name": "close_incomplete",
        "role": "close",
        "label": {
          "en": "Thank you for the answers you gave - they are recorded."
        },
        "relevance": "${outcome}='incomplete'",
        "publish": false
      },
      {
        "type": "note",
        "name": "close_declined",
        "role": "close",
        "label": {
          "en": "Thank you for your reply. We respect your decision not to take part."
        },
        "relevance": "${outcome}='declined'",
        "publish": false
      },
      {
        "type": "note",
        "name": "close_optout",
        "role": "close",
        "label": {
          "en": "Understood - nothing further will be sent about this survey. The answers you already gave are kept."
        },
        "relevance": "${outcome}='optout'",
        "publish": false
      },
      {
        "type": "note",
        "name": "close_never_started",
        "role": "close",
        "relevance": "${outcome}='unreachable'",
        "template": {
          "en": "my_survey_close"
        },
        "variables": {
          "1": "name"
        },
        "publish": false
      },
      {
        "type": "note",
        "name": "unsolicited_reply",
        "role": "unsolicited",
        "label": {
          "en": "Thanks for your message. This number only runs a short survey, so nothing further is needed from you here."
        },
        "publish": false
      }
    ],
    "choices": [
      {
        "list_name": "consent",
        "value": "yes",
        "option_id": "consent_yes",
        "label": {
          "en": "Yes, I'll take part"
        },
        "typed": {
          "en": "1|yes|y"
        }
      },
      {
        "list_name": "consent",
        "value": "no",
        "option_id": "consent_no",
        "label": {
          "en": "No, thanks"
        },
        "typed": {
          "en": "2|no|n"
        }
      },
      {
        "list_name": "frequency",
        "value": "1",
        "label": {
          "en": "Never"
        },
        "description": {
          "en": "Optional second line, up to 72 characters"
        }
      },
      {
        "list_name": "frequency",
        "value": "2",
        "label": {
          "en": "Rarely"
        }
      },
      {
        "list_name": "frequency",
        "value": "3",
        "label": {
          "en": "Sometimes"
        }
      },
      {
        "list_name": "frequency",
        "value": "4",
        "label": {
          "en": "Often"
        }
      },
      {
        "list_name": "frequency",
        "value": "-99",
        "label": {
          "en": "Prefer not to say"
        },
        "description": {

// ---------------------------------------------------------------------------

function h(tag, attrs, ...kids) {

    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;

  let n = 2;
  while (taken.has(`${base}_${n}`)) n++;
  return `${base}_${n}`;
}

function newRows(key) {
  const lang = S.spec.settings.default_language;
  if (key === "begin group") {
    const name = freeName("section");
    return [{ ...blankRow("begin group", name), label: { [lang]: "" } }, blankRow("end group", name)];
  }
  const names = { opener: "intro", consent: "consent", note: "message", close: "close", unsolicited: "unsolicited_reply", template: "template" };
  const row = blankRow("text", names[key] ? freeName(names[key]) : uniqueName("Q"));
  row.label = { [lang]: "" };
  applyStep(row, key);
  if (key === "opener") Object.assign(row, { label: {}, retries: 0, publish: false });
  if (key === "consent") Object.assign(row, { retries: 1 });
  if (["note", "close", "unsolicited", "template"].includes(key)) row.publish = false;
  if (key === "text") row.retries = 0;
  return [row];
}
function blankRow(type, name) {
  return { type, name, label: {}, role: "", relevance: "", retries: null, timeout: null, constraint: "",
    constraint_message: "", minimum: null, maximum: null, timeout_message: "", list_button: {}, template: {}, variables: {}, timeout_reminder: true,
    publish: true, encrypt: false };
}
function blankChoice(ln, value, label, typed) {
  const lang = S.spec.settings.default_language;
  return { list_name: ln, value, option_id: "", label: { [lang]: label }, description: {}, typed: typed ? { [lang]: typed } : {} };
}
function uniqueList(base) {
  const taken = new Set(S.spec.choices.map((c) => c.list_name));
  let name = base.toLowerCase().replace(/[^a-z0-9_]/g, "_") || "list";
  let n = 2;
  const root = name;
  while (taken.has(name)) name = `${root}_${n++}`;
  return name;
}

/** Turn a row into another step, keeping what still applies. */
function applyStep(row, key) {
  row.role = ROLE_OF_STEP[key] || "";
  const kind = TYPE_OF_STEP[key] || key;
  if (kind === "select_button" || kind === "select_list") {
    let ln = listOf(row);
    if (!ln) {
      ln = uniqueList(row.name);
      if (key === "consent") {
        S.spec.choices.push(blankChoice(ln, "yes", "Yes, I will take part", "1|yes|y"),
          blankChoice(ln, "no", "No, thank you", "2|no|n"));
      } else {
        const n = kind === "select_button" ? 2 : 3;
        for (let v = 1; v <= n; v++) S.spec.choices.push(blankChoice(ln, String(v), `Option ${v}`));
      }
    }
    row.type = `${kind} ${ln}`;
  } else {
    row.type = kind;
  }
  const endsSurvey = /^\$\{outcome\}/.test(row.relevance || "");
  if (key === "close" && !endsSurvey) row.relevance = "${outcome}='complete'";
  if (key !== "close" && endsSurvey) row.relevance = "";
}

// ---------------------------------------------------------------------------
// Row operations: insert, move, duplicate, delete - all undoable.
// ---------------------------------------------------------------------------
function insertAt(i, kind) {
  structural(() => {
    const rows = newRows(kind);
    S.spec.survey.splice(i, 0, ...rows);
    S.sel = i; S.open = new Set([i]); S.menuAt = null;
  });
  scrollToCard(S.sel);
}
function moveBlock(from, to) {
  // Move rows[from..blockEnd(from)] so it starts at index `to` (pre-removal).
  const end = blockEnd(from);
  if (to >= from && to <= end + 1) return;
  structural(() => {
    const block = S.spec.survey.splice(from, end - from + 1);
    const at = to > end ? to - block.length : to;
    S.spec.survey.splice(at, 0, ...block);
    S.sel = at; S.open = new Set([at]);
  });
}
function moveUp(i) { if (i > 0) moveBlock(i, i - 1); }
function moveDown(i) { const end = blockEnd(i); if (end < S.spec.survey.length - 1) moveBlock(i, end + 2); }
function duplicate(i) {
  structural(() => {
    const end = blockEnd(i);
    const copy = JSON.parse(JSON.stringify(S.spec.survey.slice(i, end + 1)));
    const name = uniqueName(`${copy[0].name}_copy`.replace(/\d+$/, "") || "copy");
    for (const r of copy) if (r.name === S.spec.survey[i].name) r.name = name;
    S.spec.survey.splice(end + 1, 0, ...copy);
    S.sel = end + 1; S.open = new Set([end + 1]);
  });
}
function remove(i) {
  const row = S.spec.survey[i];
  structural(() => {
    if (isGroupStart(row)) {
      // Deleting a section keeps its questions: only the two bracket rows go.
      const end = blockEnd(i);
      S.spec.survey.splice(end, 1);
    }
    S.spec.survey.splice(i, 1);
    clampSel(); S.open = new Set([S.sel]);
  });
  toast(`Deleted ${row.name || rowLabel(row)}`, null, ["Undo", undo]);
}

// ---------------------------------------------------------------------------
// Cards.
// ---------------------------------------------------------------------------
function renderCards() {
  const root = $("#cards");
  root.replaceChildren();
  root.append(settingsCard());
  let depth = 0;
  S.spec.survey.forEach((row, i) => {
    root.append(insertBar(i));
    if (isGroupEnd(row)) depth = Math.max(0, depth - 1);
    root.append(rowCard(row, i, depth));
    if (isGroupStart(row)) depth++;
  });
  root.append(insertBar(S.spec.survey.length, true));
}

function insertBar(i, always) {
  const open = S.menuAt === i;
  const bar = h("div", { class: `insert${open || always ? " open" : ""}` },
    h("button", { onclick: () => { S.menuAt = open ? null : i; renderCards(); } }, open ? "close" : "+ add step"));
  bar.addEventListener("dragover", (e) => { e.preventDefault(); bar.classList.add("drop"); });
  bar.addEventListener("dragleave", () => bar.classList.remove("drop"));
  bar.addEventListener("drop", (e) => {
    e.preventDefault(); bar.classList.remove("drop");
    const from = Number(e.dataTransfer.getData("text/x-row"));
    if (!Number.isNaN(from)) moveBlock(from, i);
  });
  if (!open) return bar;
  return h("div", null, bar, h("div", { class: "menu" },
    STEPS.filter(([k]) => k !== "end group").map(([k, label, tip]) => h("button", { title: tip, onclick: () => insertAt(i, k) },
      h("span", { class: "dot", style: `background:${MAP_COLORS[k] || "#999"}` }), label))));
}

function rowIssues(i) { return ISSUES.filter((x) => x.rows.includes(i)); }

function cardHead(row, i) {
  const issues = rowIssues(i);
  const errors = issues.filter((x) => x.level === "error").length;
  const lang = S.lang;
  let summary = "";
  if (isGroupEnd(row)) summary = `end of ${row.name}`;
  else if (sendsTemplate(row) && (kindOf(row) === "template" || !row.label[lang])) summary = `approved message ${row.template[lang] || "(none chosen)"}`;
  else summary = (row.label[lang] || "").replace(/\s+/g, " ").trim() || (isGroupStart(row) ? "" : "(no text)");
  const condition = row.relevance && row.role !== "close"
    ? h("span", { class: "badge cond-badge", title: "Only some people get this step" }, `only if ${conditionText(row.relevance)}`)
    : null;

  const handle = h("span", { class: "handle", title: "Drag to move", draggable: "true" }, "⠇");
  handle.addEventListener("dragstart", (e) => {
    e.dataTransfer.setData("text/x-row", String(i)); e.dataTransfer.effectAllowed = "move";
    handle.closest(".card").classList.add("dragging");
  });
  handle.addEventListener("dragend", () => handle.closest(".card")?.classList.remove("dragging"));
  const stop = (fn) => (e) => { e.stopPropagation(); fn(); };
  return h("div", { class: "card-head", onclick: () => toggleCard(i) },
    handle,
    h("span", { class: "stepno" }, i + 1),
    h("span", { class: "kind" }, rowLabel(row)),
    isGroupEnd(row) ? null : h("span", { class: "rname" }, row.name || "(unnamed)"),
    condition,
    h("span", { class: "summary" }, summary),
    isSelect(row) ? h("span", { class: "badge" }, `${choicesOf(listOf(row)).length} options`) : null,
    issues.length ? h("span", { class: `badge ${errors ? "bad" : "warn"}` }, `${issues.length} to fix`) : null,
    h("span", { class: "head-tools" },
      h("button", { class: "ghost", title: "Move up", onclick: stop(() => moveUp(i)) }, "↑"),
      h("button", { class: "ghost", title: "Move down", onclick: stop(() => moveDown(i)) }, "↓"),
      isGroupEnd(row) ? null : h("button", { class: "ghost", title: "Duplicate", onclick: stop(() => duplicate(i)) }, "⧉"),
      h("button", { class: "ghost", title: "Delete. You can undo this.", onclick: stop(() => remove(i)) }, "✕")));
}

function refreshHeads() {
  ISSUES = computeIssues();
  document.querySelectorAll(".card[data-i]").forEach((card) => {
    const i = Number(card.dataset.i);
    const row = S.spec.survey[i];
    if (row) card.querySelector(".card-head").replaceWith(cardHead(row, i));
  });
  renderIssueButton();

function toggleCard(i) {
  if (S.sel === i && S.open.has(i)) S.open.delete(i); else S.open.add(i);
  S.sel = i;
  renderCards(); renderSide();
}
function select(i) {
  S.sel = i; S.open.add(i);
  renderCards(); renderSide(); scrollToCard(i);
}
function scrollToCard(i) {

// ---------------------------------------------------------------------------
// Approved messages. Meta reviews the opener and the closing for people who
// never replied, because those reach someone who has not written to you. The
// list comes from your account when `rtt survey builder` opens the page.
// ---------------------------------------------------------------------------
function approvedIn(lang) {
  if (!APPROVED) return null;
  // "en" also takes the en_GB and en_US messages.
  return APPROVED.filter((m) => m.language === lang || m.language.split(/[_-]/)[0] === lang);
}
function approvedNamed(name, lang) {
  return (approvedIn(lang) || []).find((m) => m.name === name) || null;
}
function howToApprove() {
  return h("span", null, "Write it in ", h("code", null, "templates/<name>.json"), ", run ",
    h("code", null, "rtt template create"), " and ", h("code", null, "rtt template submit"),
    ", and open the builder again once Meta approves it (usually within a day).");
}
/** The approved message a row sends, picked from the account's list, with its text and placeholders. */
function approvedField(row, label, hint) {
  const lang = S.lang;
  row.template = row.template || {};
  row.variables = row.variables || {};
  const current = row.template[lang] || "";
  const box = h("div", { class: "fld" },
    h("div", { class: "fld-label" }, h("span", null, label, h("span", { class: "hint" }, "  ", hint))));
  const list = approvedIn(lang);
  if (list === null) {
    box.append(h("div", { class: "note-box" }, "Open the builder with ", h("code", null, "just survey builder"),
      " to pick from the messages Meta approved on your account, and see their text. Until then, type the name."));
    const f = textField("", row.template, lang, { mono: true });
    f.classList.remove("fld");
    box.append(f);
    return box;
  }
  const options = [["", list.length ? "Choose an approved message" : `No approved messages in ${lang} on your account`],
    ...list.map((m) => [m.name, m.name])];
  if (current && !list.some((m) => m.name === current)) options.push([current, `${current} (not approved on your account)`]);
  const sel = h("select", null, options.map(([v, t]) => h("option", { value: v }, t)));
  sel.value = current;
  sel.addEventListener("change", () => structural(() => {
    if (sel.value) row.template[lang] = sel.value; else delete row.template[lang];
    const keep = new Set((approvedNamed(sel.value, lang) || {}).placeholders || []);
    for (const p of Object.keys(row.variables)) if (!keep.has(p)) delete row.variables[p];
  }));
  box.append(sel);
  const msg = approvedNamed(current, lang);
  if (msg) box.append(approvedPreview(row, msg));
  box.append(h("div", { class: "hint", style: "margin-top:4px" }, "None of them fits? ", howToApprove()));
  return box;
}
function approvedText(text, row) {
  return (text || "").replace(/\{\{\s*(\w+)\s*\}\}/g, (all, p) => {
    const column = (row.variables || {})[p];
    return column ? `\${${column}}` : all;
  });
}
function approvedPreview(row, msg) {
  const columns = S.spec.settings.preloads.filter((c) => c !== "sent_at");
  const wrap = h("div", { class: "approved" });
  const body = h("div", { class: "approved-body" });
  body.innerHTML = waFormat(approvedText(msg.body, row));
  wrap.append(body);
  if (msg.buttons.length) wrap.append(h("div", { class: "approved-buttons" }, msg.buttons.map((b) => h("span", null, b))));
  for (const p of msg.placeholders) {
    const pick = h("select", null, h("option", { value: "" }, "Choose a column"), columns.map((c) => h("option", { value: c }, c)));
    pick.value = row.variables[p] || "";
    pick.addEventListener("change", () => structural(() => {
      if (pick.value) row.variables[p] = pick.value; else delete row.variables[p];
    }));
    wrap.append(h("div", { class: "approved-var" }, h("span", { class: "var" }, `{{${p}}}`), "is filled from", pick,
      h("span", { class: "hint" }, msg.samples[p] ? `Meta's example: ${msg.samples[p]}` : "")));
  }
  if (msg.placeholders.length) {
    wrap.append(h("div", { class: "hint", style: "margin-top:6px" },
      "Every row of the sample file needs these columns filled: an empty one stops the message from being sent."));
  }
  return wrap;
}

// Emoji that read well on WhatsApp. Kept out of option labels, which are
// matched letter by letter against what the person types.
const EMOJI = ["👋", "😊", "🙏", "✅", "❌", "👍", "📋", "📝", "⏰", "📅", "📞", "💬", "🎉", "⭐", "❤️", "💡", "📌", "🔒", "👉", "☺️"];
function insertAtCursor(input, text) {
  const start = input.selectionStart ?? input.value.length;
  const end = input.selectionEnd ?? start;
  input.value = input.value.slice(0, start) + text + input.value.slice(end);
  input.selectionStart = input.selectionEnd = start + text.length;
  input.focus();
  input.dispatchEvent(new Event("input"));
  input.dispatchEvent(new Event("change"));
}
/** Emoji and sample-file columns for a message field. */
function textTools(input) {
  const palette = h("div", { class: "palette", style: "display:none" },
    EMOJI.map((e) => h("button", { type: "button", title: "Insert", onclick: () => insertAtCursor(input, e) }, e)));
  const columns = S.spec.settings.preloads.filter((c) => !["caseid", "sent_at"].includes(c));
  const pick = h("select", { title: "Adds ${column}: each person gets their own value from the sample file, such as their name" },
    h("option", { value: "" }, "Insert a column"), columns.map((c) => h("option", { value: c }, c)));
  pick.addEventListener("change", () => { if (pick.value) insertAtCursor(input, `\${${pick.value}}`); pick.value = ""; });
  return h("div", null,
    h("div", { class: "tools" },
      h("button", { type: "button", class: "ghost", onclick: () => { palette.style.display = palette.style.display === "none" ? "flex" : "none"; } }, "😊 Emoji"),
      columns.length ? pick : null),
    palette);
}

function rowCard(row, i, depth) {
  const open = S.open.has(i);
  const card = h("div", {
    class: `card${S.sel === i ? " sel" : ""}`, "data-i": i,
    style: `--kc:${rowColor(row)};margin-left:${depth * 22}px`,
  }, cardHead(row, i), open ? rowBody(row, i) : null);
  return card;
}

function rowBody(row, i) {
  const kind = kindOf(row);
  const key = stepKey(row);
  const st = S.spec.settings;
  const body = h("div", { class: "card-body" });

  const picker = selectField("Step type", STEPS.map(([k, label]) => [k, label]), key,
    (k) => structural(() => applyStep(row, k)));
  picker.append(h("div", { class: "hint", style: "margin-top:4px" }, STEP_HELP[key] || ""));
  body.append(h("div", { class: "grid2" },
    picker,
    isGroupEnd(row) ? h("div") : textField(isQuestion(row) ? "Column name" : "Step name", row, "name", {
      mono: true, onChange: () => renderAll(),
      hint: isQuestion(row) ? "The answer is saved in the data under this name." : "Used to find this step. People never see it.",
    })));

  if (isGroupEnd(row)) {
    body.append(h("div", { class: "note-box" }, `This marks the end of the section "${row.name}". Move this card to change which steps are in the section.`));
    return body;
  }

  const conditional = isGroupStart(row) || (isQuestion(row) && !["intro", "consent", "close"].includes(row.role));
  if (conditional) body.append(conditionEditor(row, i, isGroupStart(row)));

  if (isGroupStart(row)) {
    body.append(langFields("Section name for your team", row, "label", { hint: "People never see it." }));
    return body;
  }

  // What the person reads.
  if (kind === "template") {
    body.append(approvedField(row, "Approved message",
      "Meta reviews this one, because the person has not written to you yet."));
  } else {
    const cap = isSelect(row) ? L["list-picker:body"] : 0;
    body.append(langFields("Message", row, "label", { multiline: true, cap, count: true, rows: 4,
      hint: "*bold*  _italic_" }));
  }

  if (isSelect(row)) body.append(choicesEditor(row));
  if (kind === "select_list") {
    body.append(langFields("List button text", row, "list_button", { cap: L.list_button,
      placeholder: message("list_button", st.default_language) || "Choose",
      hint: "The button the person taps to open the list. Leave it blank to use the standard text." }));
  }

  if (row.role === "close") body.append(closeFields(row));

  if (isQuestion(row) && kind !== "template") {
    const grid = h("div", { class: "grid2" });
    if (isValidated(row)) {
      grid.append(numberField("Times to ask again", row, "retries", st.default_retries,
        "If the reply does not fit, the question is sent again. After the last try, the answer is marked as an error."));
    }
    grid.append(numberField("Wait for a reply (seconds)", row, "timeout", st.default_timeout,
      "After this, the person is marked as not replying. 3600 is one hour."));
    body.append(grid);
    if (CONSTRAINED.has(kind)) body.append(rangeFields(row, kind));
    if (isValidated(row)) body.append(nudgeField(row));
    if (CONSTRAINED.has(kind)) {
      body.append(h("details", { class: "more", open: row.constraint ? true : null }, h("summary", null, "Advanced"),
        textField("Accepted reply pattern", row, "constraint", { mono: true, placeholder: C.default_constraints[kind] || "",
          hint: kind === "integer" ? "Leave it blank to accept any whole number." : "Leave it blank to accept any number." })));
    }
  }

  if (isQuestion(row)) {
    if (kind !== "template") body.append(reminderField(row));
    if (listensForStop(row)) {

    }
    if (kind !== "template") {

      body.append(h("div", { class: "hint", style: "margin-top:4px" }, "Use it for answers that identify someone, such as a name or phone number."));
      if (!row.publish) {
        body.append(h("div", { class: "note-box" }, "This answer is not saved to the dataset. ",
          h("button", { onclick: () => structural(() => { row.publish = true; }) }, "Save it to the dataset")));
      }
    }

  if (kind === "note" && row.role !== "close" && Object.values(row.template || {}).some(Boolean)) {
    body.append(approvedField(row, "Approved message", "Sent instead of the message when more than 24 hours have passed."));
  }

  return body;

function stopWords(lang) {

  return words;
}
function stopWordsLine() {
  return `The words are ${stopWords(S.lang).join(", ")}, in any capitals. The person gets the opt-out closing, and the answers they already gave are kept.`;
}

/** The no-reply reminder: on by default, with this question's own text if it has one. */
function reminderField(row) {
  const lang = S.lang;
  const st = S.spec.settings;
  const standard = message(C.reminder_message, lang);
  const ownKey = (k) => k && k !== C.reminder_message &&
    S.spec.survey.filter((r) => r.timeout_message === k).length === 1;
  const box = h("div", { class: "fld" });
  box.append(h("div", { class: "checks" }, check("Send a reminder if the person does not reply", row, "timeout_reminder")));
  if (!row.timeout_reminder) {
    box.append(h("div", { class: "hint", style: "margin-top:4px" }, `No reminder. After ${duration(row.timeout ?? st.default_timeout)} without a reply, the person is marked as not replying.`));
    return box;
  }

  const stopNote = st.stop_words === "opening_and_reminders"

      h("span", { class: "hint" }, `  Sent after ${duration(st.reminder_after)} without a reply, with the question again. Leave it blank to use the standard reply shown in grey.`)),
    input, textTools(input),
    h("div", { class: "hint", style: "margin-top:4px" }, stopNote));

/** The smallest and largest number a question takes, both included. */
function rangeFields(row, kind) {
  const field = (label, key) => {
    const input = h("input", { value: row[key] ?? "", placeholder: "any", inputmode: "decimal", class: "mono" });
    input.addEventListener("change", () => {

      input.classList.toggle("invalid", !ok);
      if (!ok) return toast(kind === "integer" ? "Use a whole number, or leave it blank." : "Use a number, or leave it blank.", "error");
      structural(() => { row[key] = n; });
    });

  };
  return h("div", null,

        } else if (APPROVED) {
          const msg = approvedNamed(name, lang);
          if (!msg) add("error", [i], `${r.name} sends ${name}, which is not approved on your account in ${lang}.`);
          else {
            for (const p of msg.placeholders) {
              const column = (r.variables || {})[p];
              if (!column) add("error", [i], `${r.name}: choose the column that fills {{${p}}} of ${name}.`);
              else if (!S.spec.settings.preloads.includes(column)) add("error", [i], `${r.name}: {{${p}}} is filled from ${column}, which is not under Preloads.`);
            }
          }
        }
        if (kind === "template") return;
      }
      if (!sendsTemplate(r) && !(r.label[lang] || "").trim()) add("warn", [i], `${r.name} has no message yet.`);
      for (const [, column] of (r.label[lang] || "").matchAll(/\$\{(\w+)\}/g)) {
        if (!S.spec.settings.preloads.includes(column)) add("error", [i], `${r.name} writes \${${column}}, which is not under Preloads.`);
      }
      if (!isQuestion(r)) return;
      const body = r.label[lang] || "";
      if (isSelect(r) && chars(body) > L["list-picker:body"]) {
        add("error", [i], `The message in ${r.name} is ${chars(body)} characters. WhatsApp allows ${L["list-picker:body"]} with options.`);
      }
      if (kind === "select_list") {
        const button = r.list_button[lang] || message("list_button", lang);
        if (chars(button) > L.list_button) add("warn", [i], `The list button in ${r.name} is over ${L.list_button} characters, so WhatsApp may cut it off.`);
      }
      const n = choicesOf(listOf(r)).length;
      if (kind === "select_list" && !(n >= 1 && n <= L.max_list_items)) {
        add("error", [i], `${r.name} has ${n} options. A list can have 1 to ${L.max_list_items}.`);
      }
      if (kind === "select_button" && !(n >= 1 && n <= L.max_session_buttons)) {
        add("error", [i], `${r.name} has ${n} buttons. WhatsApp sends at most ${L.max_session_buttons}; use a list for more.`,
          r.role !== "consent" && n > L.max_session_buttons && n <= L.max_list_items ? { label: "Switch to a list", run: () => structural(() => applyStep(r, "select_list")) } : null);
      }
    });

    const lists = new Set(S.spec.choices.map((c) => c.list_name));
    for (const ln of lists) {
      const where = indexOfRows(ln);
      const owner = where.map((j) => rows[j].name).join(", ") || ln;
      const labels = new Map();
      for (const c of choicesOf(ln)) {
        const label = c.label[lang] || "";
        const named = `Option ${c.value} in ${owner}`;
        if (!label.trim()) add("warn", where, `${named} has no label.`);
        const cap = labelCap(ln);
        if (chars(label) > cap) {
          add("error", where, cap === L.button_title
            ? `${named} has a ${chars(label)}-character label. WhatsApp shows ${cap} on a button, so it would be cut off.`
            : `${named} has a ${chars(label)}-character label. WhatsApp allows ${cap}.`);
        }
        if (chars(c.description[lang]) > L["list-picker:description"]) add("error", where, `${named} has a description over ${L["list-picker:description"]} characters.`);
        if (hasEmoji(label)) add("error", where, `${named} has an emoji in its label. Labels are matched letter by letter, so keep emoji in the message instead.`);
        const key = label.toLowerCase();
        if (key && labels.has(key)) add("error", where, `${owner} uses the label "${label}" twice, so the saved code would be unclear.`);
        labels.set(key, true);
      }
      {
        const values = choicesOf(ln).map((c) => c.value);
        if (values.some((v) => v === "")) add("error", where, `${owner} has an option with no code.`);
        if (new Set(values).size !== values.length) add("error", where, `${owner} uses the same code twice.`);
      }
    }
  }
  rows.forEach((r, i) => { if (isSelect(r) && !choicesOf(listOf(r)).length && !listOf(r)) add("error", [i], `${r.name} has no options.`); });
  rows.forEach((r, i) => {
    if (!hasRange(r)) return;
    if (r.minimum !== null && r.maximum !== null && r.minimum > r.maximum) add("error", [i], `${r.name}: the smallest number is above the largest.`);
    if (r.minimum !== null && r.minimum < 0 && !r.constraint) add("error", [i], `${r.name}: the standard number check refuses a minus sign, so a negative smallest number needs an Accepted reply pattern that takes one.`);
    if (saysItsRange(r) && !message(C.range_message, S.lang).trim()) add("error", [i], `${r.name} has a range, so it needs the standard reply for numbers out of range (Survey settings).`);
  });
  rows.forEach((r, i) => {
    if (!r.relevance || r.role === "close") return;
    const parsed = parseRelevance(r.relevance);
    if (!parsed) { add("error", [i], `${r.name}: the condition cannot be read. Use only and, or only or.`); return; }
    for (const c of parsed.clauses) {
      if ((c.op === ">" || c.op === "<") && !/^-?\d+(?:[.,]\d+)?$/.test(c.value)) add("error", [i], `${r.name}: ${c.name} ${OP_WORDS[c.op]} needs a number.`);
    }
  });
  const st = S.spec.settings;
  if (!(st.reminder_after > 0 && st.reminder_after < C.session_window)) {
    add("error", [], "The reminder has to go out within 24 hours. After that, WhatsApp allows only approved templates.");
  }
  rows.forEach((r, i) => {
    const key = reminderKey(r);
    if (!key) return;
    const text = message(key, S.lang);
    if (!text.trim()) add("warn", [i], `${r.name} sends a reminder with no text yet.`);
    else if (st.stop_words === "opening_and_reminders" && !text.toLowerCase().includes(C.universal_stop_word)) {
      add("warn", [i], `The reminder for ${r.name} does not say they can reply STOP.`);
    }
  });
  return out;
}

// Phone preview.

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}
function waFormat(s) {
  return escapeHtml(s || "")
    .replace(/\{\{\s*([^}]+?)\s*\}\}/g, '<span class="var">$1</span>')
    .replace(/\$\{(\w+)\}/g, '<span class="var">$1</span>')
    .replace(/```([\s\S]+?)```/g, "<code>$1</code>")
    .replace(/(^|[\s(])\*(\S(?:[^*\n]*\S)?)\*(?=$|[\s).,!?:;])/g, "$1<b>$2</b>")
    .replace(/(^|[\s(])_(\S(?:[^_\n]*\S)?)_(?=$|[\s).,!?:;])/g, "$1<i>$2</i>")
    .replace(/(^|[\s(])~(\S(?:[^~\n]*\S)?)~(?=$|[\s).,!?:;])/g, "$1<s>$2</s>")
    .replace(/\n/g, "<br>");
}
function bubble(text, cls) {
  const b = h("div", { class: `bubble ${cls || ""}` });
  b.innerHTML = waFormat(text); // escaped above; only WhatsApp markup becomes tags
  if (!cls) b.append(h("span", { class: "time" }, "10:42"));
  return b;
}

function renderPreview() {
  const root = $("#phone");
  root.replaceChildren();
  const row = S.spec.survey[S.sel];
  const lang = S.lang;
  $("#preview-meta").textContent = row ? `step ${S.sel + 1}, ${lang}` : "";
  const st = S.spec.settings;
  const chat = h("div", { class: "chat" });
  const phone = h("div", { class: "phone" },
    h("div", { class: "phone-top" }, h("span", { class: "avatar" }, (st.form_title || "S")[0].toUpperCase()), st.form_title || st.form_id || "Survey"),
    chat);
  root.append(phone);
  if (!row) { chat.append(bubble("Add a step to see how it looks.", "sys")); return; }

  const kind = kindOf(row);
  if (isGroupStart(row) || isGroupEnd(row)) {
    chat.append(bubble(isGroupStart(row)
      ? `Section ${row.name}${row.relevance ? `\nOnly for people where ${conditionText(row.relevance)}` : "\nEveryone gets this section"}`
      : `End of section ${row.name}`, "sys"));
    return;
  }
  if (sendsTemplate(row)) {
    const msg = approvedNamed(row.template[lang], lang);
    if (msg) {
      chat.append(bubble(approvedText(msg.body, row)));
      msg.buttons.forEach((b) => chat.append(h("div", { class: "wa-btn" }, b)));
    } else {
      chat.append(bubble(`Approved message "${row.template[lang] || "(none chosen)"}"\n${APPROVED ? "Not approved on your account." : "Open the builder with just survey builder to see its text."}`, "sys"));
    }
    if (kind === "template") { root.append(facts(row)); return; }
  }
  if (!(kind === "template") && !(sendsTemplate(row) && !row.label[lang])) {
    const text = row.label[lang] || "";
    const b = bubble(text || "(no message yet)");
    if (kind === "select_list") {
      b.querySelector(".time").before(h("div", { class: "wa-list-btn" }, "☰ ", row.list_button[lang] || message("list_button", lang) || "Choose"));
    }
    chat.append(b);
  }
  if (kind === "select_button") {
    choicesOf(listOf(row)).forEach((c, n) => chat.append(
      h("div", { class: `wa-btn${n >= L.max_session_buttons ? " over" : ""}`, title: n >= L.max_session_buttons ? "WhatsApp will not send this button" : "" },
        c.label[lang] || "(no label)")));
  }
  if (kind === "select_list") {
    chat.append(h("div", { class: "sheet" },
      h("div", { class: "sheet-title" }, row.list_button[lang] || message("list_button", lang) || "Choose"),
      choicesOf(listOf(row)).map((c) => h("div", { class: "sheet-row" },
        h("div", null, c.label[lang] || "(no label)", c.description[lang] ? h("small", null, c.description[lang]) : null),
        h("span", { class: "radio" })))));
  }
  if (isQuestion(row)) root.append(facts(row));
}

function facts(row) {
  const kind = kindOf(row);
  const st = S.spec.settings;
  const lang = S.lang;
  const dl = h("dl", { class: "facts" });
  const add = (term, ...desc) => dl.append(h("dt", null, term), h("dd", null, ...desc));
  if (kind === "template") {
    add("Waits for", "any reply. The opener only opens the 24-hour window for the messages after it, so nothing is saved.");
    return dl;
  }
  add("Saved as", h("code", null, row.name || "?"), row.publish ? "" : " (not saved to the dataset)", row.encrypt ? ", encrypted" : "");
  if (isSelect(row)) {
    const list = choicesOf(listOf(row));
    add("Codes", h("table", { class: "codes" }, list.map((c) => h("tr", null, h("td", null, h("code", null, c.value)), h("td", null, c.label[lang] || "")))));
  }
  if (isValidated(row)) {
    const tries = row.retries ?? st.default_retries;
    // Blank picks error_option or error_option_labels from whether a typed
    // digit would be ambiguous - the check decides, so say which is a guess.
    const key = saysItsRange(row) ? C.range_message : row.constraint_message || (isSelect(row) ? "error_option" : "error_numeric");
    if (hasRange(row)) add("Takes", `numbers ${rangeText(row)}`);
    add("If the reply does not fit", `asked again up to ${tries} time${tries === 1 ? "" : "s"}, then the answer is marked as an error`);
    const button = row.list_button[lang] || message("list_button", lang) || "Choose";
    const nudge = message(key, lang).replaceAll("{button}", button).replaceAll("{range}", hasRange(row) ? rangeText(row) : "");
    if (nudge) {
      dl.append(h("dd", null, bubble(nudge)));
    }
  } else {
    add("Checking", "none. Any reply is saved as written.");
  }
  const wait = row.timeout ?? st.default_timeout;
  const remind = reminderKey(row);
  if (remind) {
    add("If nobody replies", `after ${duration(st.reminder_after)} the reminder goes out with the question again; after ${duration(wait)} more, the person is marked as not replying`);
    const text = message(remind, lang);
    if (text) dl.append(h("dd", null, bubble(text)));
  } else {
    add("If nobody replies", `after ${duration(wait)} the person is marked as not replying`);
  }
  if (listensForStop(row)) add("Stop words", "a stop word here ends the survey with the opt-out closing");
  if (row.relevance) add("Only if", conditionText(row.relevance), ". Everyone else skips this question.");
  return dl;
}

// ---------------------------------------------------------------------------
// Flow map: the shape of the instrument, which a list of cards cannot show.
// Sections with a condition become lanes side by side; closings fan out at the
// end; widgets every flow shares (launch, publish) are drawn dashed.
// ---------------------------------------------------------------------------
const NW = 132, NH = 38, GAP = 16, PAD = 8, LANE_GAP = 10;

function tree(rows) {
  const root = [];
  const stack = [root];
  rows.forEach((row, i) => {
    if (row.role === "close" || row.role === "unsolicited") return;
    if (isGroupStart(row)) {
      const g = { kind: "group", row, i, children: [] };
      stack[stack.length - 1].push(g); stack.push(g.children);
    } else if (isGroupEnd(row)) {
      if (stack.length > 1) stack.pop();
    } else {
      stack[stack.length - 1].push({ kind: "row", row, i });
    }
  });
  return root;
}
function segments(items) {
  const out = [];
  for (const it of items) {
    if (it.kind === "group" && it.row.relevance) {
      const last = out[out.length - 1];
      if (last && last.kind === "branch") last.groups.push(it); else out.push({ kind: "branch", groups: [it] });
    } else out.push(it);
  }
  return out;
}
function width(items) {
  let w = NW;
  for (const seg of segments(items)) {
    if (seg.kind === "row") continue;
    if (seg.kind === "group") w = Math.max(w, width(seg.children) + 2 * PAD);
    else {
      const lanes = seg.groups.map((g) => width(g.children) + 2 * PAD);
      if (seg.groups.length === 1) lanes.push(70);
      w = Math.max(w, lanes.reduce((a, b) => a + b, 0) + LANE_GAP * (lanes.length - 1));
    }
  }
  return w;
}

function renderMap() {
  const rows = S.spec.survey;
  const items = tree(rows);
  const closes = rows.map((row, i) => ({ row, i })).filter((x) => x.row.role === "close");
  const unsolicited = rows.map((row, i) => ({ row, i })).filter((x) => x.row.role === "unsolicited");
  const issueRows = new Set(ISSUES.filter((x) => x.level === "error").flatMap((x) => x.rows));
  const g = { nodes: [], lines: [], bands: [], labels: [] };
  const W = Math.max(width(items), 2 * NW + LANE_GAP, 300);
  const cx0 = W / 2 + 8;

  const node = (x, y, w, item, extra = {}) => g.nodes.push({ x, y, w, h: NH, item, ...extra });
  const line = (x1, y1, x2, y2, dashed) => g.lines.push({ x1, y1, x2, y2, dashed });

  let y = 8;
  node(cx0 - NW / 2, y, NW, null, { title: "Start", sub: "one run per phone number", ghost: true });
  let prev = { x: cx0, y: y + NH };
  y += NH + GAP;

  function place(list, cx, avail) {
    for (const seg of segments(list)) {
      if (seg.kind === "row") {
        line(prev.x, prev.y, cx, y);
        node(cx - NW / 2, y, NW, seg);
        prev = { x: cx, y: y + NH };
        y += NH + GAP;
      } else if (seg.kind === "group") {
        const w = Math.min(avail, width(seg.children) + 2 * PAD);
        const top = y;
        g.labels.push({ x: cx - w / 2 + 6, y: top + 13, text: seg.row.name, i: seg.i });
        y += 20;
        place(seg.children, cx, w - 2 * PAD);
        g.bands.push({ x: cx - w / 2, y: top, w, h: y - top - GAP / 2, i: seg.i });
        y += 4;
      } else {
        // A condition splits the path into lanes that meet again below.
        const lanes = seg.groups.map((grp) => ({ grp, w: width(grp.children) + 2 * PAD }));
        if (lanes.length === 1) lanes.push({ grp: null, w: 70 });
        const total = lanes.reduce((a, l) => a + l.w, 0) + LANE_GAP * (lanes.length - 1);
        const split = { x: cx, y: y + 10 };
        line(prev.x, prev.y, split.x, split.y - 10);
        g.nodes.push({ diamond: true, x: split.x, y: split.y });
        const top = y + 34;
        let left = cx - total / 2;
        const ends = [];
        let bottom = top;
        for (const lane of lanes) {
          const lx = left + lane.w / 2;
          y = top;
          if (lane.grp) {
            g.labels.push({ x: left + 6, y: top + 13, text: conditionText(lane.grp.row.relevance), i: lane.grp.i });
            prev = { x: split.x, y: split.y + 10 };
            line(prev.x, prev.y, lx, top);
            prev = { x: lx, y: top };
            y = top + 22;
            place(lane.grp.children, lx, lane.w - 2 * PAD);
            g.bands.push({ x: left, y: top, w: lane.w, h: y - top - GAP / 2, i: lane.grp.i, lane: true });
            ends.push({ x: lx, y: y - GAP / 2 });
          } else {
            line(split.x, split.y + 10, lx, top, true);
            g.labels.push({ x: lx - 22, y: top + 14, text: "otherwise", muted: true });
            ends.push({ x: lx, y: top + 22 });
            y = top + 30;
          }
          bottom = Math.max(bottom, y);
          left += lane.w + LANE_GAP;
        }
        y = bottom + 6;
        for (const e of ends) line(e.x, e.y, cx, y);
        g.nodes.push({ dot: true, x: cx, y });
        prev = { x: cx, y };
        y += GAP;
      }
    }
  }
  place(items, cx0, W);

  line(prev.x, prev.y, cx0, y);
  node(cx0 - NW / 2, y, NW, null, { title: "Save the answers", sub: "one row per person", ghost: true });
  const pub = { x: cx0, y: y + NH };
  y += NH + GAP + 10;

  if (closes.length) {
    const per = Math.max(1, Math.floor((W + LANE_GAP) / (NW * 0.82 + LANE_GAP)));
    const cw = Math.min(NW, (W - LANE_GAP * (Math.min(per, closes.length) - 1)) / Math.min(per, closes.length));
    closes.forEach((c, n) => {
      const col = n % per, rowN = Math.floor(n / per);
      const count = Math.min(per, closes.length - rowN * per);
      const span = count * cw + (count - 1) * LANE_GAP;
      const x = cx0 - span / 2 + col * (cw + LANE_GAP);
      const yy = y + rowN * (NH + GAP);
      line(pub.x, pub.y, x + cw / 2, yy, true);
      node(x, yy, cw, c, { terminal: true });
    });
    y += Math.ceil(closes.length / per) * (NH + GAP);
  }
  if (unsolicited.length) {
    y += 8;
    g.labels.push({ x: 10, y: y + 4, text: "Outside the flow", muted: true });
    y += 12;
    unsolicited.forEach((u) => { node(cx0 - NW / 2, y, NW, u); y += NH + GAP; });
  }

  const svgW = W + 16, svgH = y + 6;
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, text) => {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) if (v !== null && v !== undefined) e.setAttribute(k, v);
    if (text !== undefined) e.textContent = text;
    return e;
  };
  const svg = el("svg", { width: svgW, height: svgH, viewBox: `0 0 ${svgW} ${svgH}` });
  for (const b of g.bands) {
    const r = el("rect", { x: b.x, y: b.y, width: b.w, height: Math.max(b.h, 24), rx: 8,
      fill: b.lane ? "#f5f6ff" : "#f8f9fb", stroke: S.sel === b.i ? "#4f46e5" : "#d9dcff", "stroke-dasharray": b.lane ? null : "4 3" });
    r.style.cursor = "pointer";
    r.addEventListener("click", () => select(b.i));
    svg.append(r);
  }
  for (const l of g.lines) {
    svg.append(el("line", { x1: l.x1, y1: l.y1, x2: l.x2, y2: l.y2, stroke: "#b7bdc8", "stroke-width": 1.5,
      "stroke-dasharray": l.dashed ? "4 3" : null }));
  }
  for (const lab of g.labels) {
    const t = el("text", { x: lab.x, y: lab.y, "font-size": 11, fill: lab.muted ? "#8a93a3" : "#4f46e5",
      "font-weight": lab.muted ? 400 : 600, "font-family": lab.mono ? "Consolas, monospace" : null }, clip(lab.text, 30));
    if (lab.i !== undefined) { t.style.cursor = "pointer"; t.addEventListener("click", () => select(lab.i)); }
    svg.append(t);
  }
  for (const n of g.nodes) {
    if (n.diamond) {
      svg.append(el("path", { d: `M${n.x} ${n.y - 10} L${n.x + 12} ${n.y} L${n.x} ${n.y + 10} L${n.x - 12} ${n.y} Z`,
        fill: "#fff", stroke: "#4f46e5", "stroke-width": 1.5 }));
      continue;
    }
    if (n.dot) { svg.append(el("circle", { cx: n.x, cy: n.y, r: 3, fill: "#b7bdc8" })); continue; }
    const grp = el("g", { class: n.item ? "map-node" : null });
    const row = n.item && n.item.row;
    const color = row ? mapColor(row) : "#9aa3b2";
    const selected = n.item && n.item.i === S.sel;
    const bad = n.item && issueRows.has(n.item.i);
    grp.append(el("rect", { class: "box", x: n.x, y: n.y, width: n.w, height: n.h, rx: n.terminal ? 18 : 7,
      fill: n.ghost ? "#fff" : "#fff", stroke: bad ? "#d92d20" : selected ? "#4f46e5" : color,
      "stroke-width": selected || bad ? 2.5 : 1.3, "stroke-dasharray": n.ghost ? "4 3" : null }));
    if (row) grp.append(el("rect", { x: n.x, y: n.y, width: 5, height: n.h, rx: 2, fill: color }));
    const maxChars = Math.floor((n.w - 16) / 6.2);
    const title = row ? `${row.role === "close" ? (OUTCOME_LABEL[outcomeOf(row)] || "Closing") : rowLabel(row)}  ${row.role === "close" ? "" : row.name}` : n.title;
    const sub = row ? (sendsTemplate(row) && (kindOf(row) === "template" || !row.label[S.lang]) ? `approved ${row.template[S.lang] || ""}` : (row.label[S.lang] || "").replace(/\s+/g, " ")) : n.sub;
    grp.append(el("text", { x: n.x + 11, y: n.y + 15, "font-size": 11.5, "font-weight": 700, fill: row ? color : "#6b7385" }, clip(title, maxChars)));
    grp.append(el("text", { x: n.x + 11, y: n.y + 30, "font-size": 10.5, fill: "#6b7385" }, clip(sub, maxChars + 2)));
    if (row && isValidated(row)) {
      const tries = row.retries ?? S.spec.settings.default_retries;
      if (tries > 0) grp.append(el("text", { x: n.x + n.w - 6, y: n.y + 15, "font-size": 10.5, fill: "#8a93a3", "text-anchor": "end" }, `↻${tries}`));
    }
    if (row && row.encrypt) grp.append(el("text", { x: n.x + n.w - 6, y: n.y + 30, "font-size": 10, fill: "#8a93a3", "text-anchor": "end" }, "enc"));
    if (n.item) grp.addEventListener("click", () => select(n.item.i));
    if (row) grp.append(el("title", {}, `${rowLabel(row)} ${row.name}\n${row.label[S.lang] || ""}`));
    svg.append(grp);
  }
  const map = $("#map");
  map.replaceChildren(svg);
  const q = rows.filter(isQuestion).length;
  $("#map-meta").textContent = `${q} questions, ${closes.length} closings`;
}
function outcomeOf(row) {
  const m = /^\$\{outcome\}\s*=\s*'([^']*)'$/.exec(row.relevance || "");
  return m ? m[1] : "closing";
}
function clip(s, n) { const a = [...(s || "")]; return a.length > n ? a.slice(0, Math.max(1, n - 1)).join("") + "…" : a.join(""); }

// ---------------------------------------------------------------------------
// Header, rendering, wiring.
// ---------------------------------------------------------------------------
function renderHeader() {
  $("#file-name").textContent = S.fileName;
  // One language at a time: the one being deployed. A file that carries more
  // keeps them untouched; the switcher only appears for such a file.
  const langs = S.spec.settings.languages;
  const seg = $("#langs");
  seg.replaceChildren(...langs.map((lang) =>
    h("button", { class: lang === S.lang ? "on" : "", onclick: () => { S.lang = lang; renderHeader(); renderCards(); renderSide(); } }, lang)));
  seg.hidden = langs.length < 2;
  $("#langs-label").hidden = langs.length < 2;
  updateDirty();
}
function renderSide() { ISSUES = computeIssues(); renderMap(); renderPreview(); renderIssues(); renderIssueButton(); }
function renderAll() { ISSUES = computeIssues(); renderHeader(); renderCards(); renderSide(); }

let toastTimer = null;
function toast(text, level, action) {
  document.querySelector(".toast")?.remove();
  const t = h("div", { class: `toast ${level || ""}` }, text,
    action ? h("button", { onclick: () => { t.remove(); action[1](); } }, action[0]) : null);
  document.body.append(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), level === "error" ? 9000 : 4500);
}

$("#btn-new").addEventListener("click", () => guarded(() => {
  loadSpec(JSON.parse(JSON.stringify(C.starter)), "my_survey.json", null);
  S.savedText = ""; updateDirty();
  toast("Started from the example survey, which has one step of every type.");
}, "New"));
$("#btn-open").addEventListener("click", () => guarded(openFile, "Open"));
$("#btn-save").addEventListener("click", save);
$("#btn-saveas").addEventListener("click", saveAs);
$("#btn-undo").addEventListener("click", undo);
$("#btn-redo").addEventListener("click", redo);
$("#btn-issues").addEventListener("click", () => $("#issues-title").scrollIntoView({ behavior: "smooth" }));
$("#btn-copy").addEventListener("click", async () => {
  const st = S.spec.settings;
  const flow = st.flow_name[S.lang] || `${st.form_id}_${S.lang}`;
  const cmd = [
    `just survey check ${S.fileName}`,
    `just survey content ${S.fileName}`,
    `just survey build ${S.fileName} --lang ${S.lang}`,
    `just flow deploy flows/${flow}.json`,
  ].join("\n");
  try { await navigator.clipboard.writeText(cmd); toast("Copied the four commands: check, create the buttons and lists, build, deploy as a draft."); }
  catch { toast(`Run: ${cmd.replaceAll("\n", " ; ")}`); }
});

document.addEventListener("keydown", (e) => {
  const mod = e.ctrlKey || e.metaKey;
  if (!mod) return;
  const k = e.key.toLowerCase();
  if (k === "s") { e.preventDefault(); save(); return; }
  const typing = ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName);
  if (typing) return; // a field keeps its own undo
  if (k === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
  if ((k === "z" && e.shiftKey) || k === "y") { e.preventDefault(); redo(); }
});
window.addEventListener("dragover", (e) => { if (e.dataTransfer.types.includes("Files")) e.preventDefault(); });
window.addEventListener("drop", async (e) => {
  const file = e.dataTransfer.files && e.dataTransfer.files[0];
  if (!file) return;
  e.preventDefault();
  guarded(async () => readText(await file.text(), file.name, null), "drop");
});
window.addEventListener("beforeunload", (e) => { if (isDirty()) e.preventDefault(); });

loadSpec(JSON.parse(JSON.stringify(C.starter)), "my_survey.json", null);
</script>
</body>
</html>
