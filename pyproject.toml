[project]
name = "requests-to-twilio"
version = "2.0.0"
description = "Launch SMS/WhatsApp surveys via Twilio Studio and decrypt the PII they collect."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Innovations for Poverty Action" }]
keywords = ["twilio", "whatsapp", "sms", "survey", "research", "encryption"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "cryptography>=44.0.0",
    "duckdb>=1.1.3",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "python-dotenv>=1.0.1",
    # Used directly for the two Twilio endpoints the SDK does not cover: the
    # multipart function-source upload, and Flows/Validate. It arrives anyway as
    # a twilio dependency, but relying on that would break silently if the SDK
    # ever changed HTTP client.
    "requests>=2.32.0",
    "tenacity>=9.0.0",
    "twilio>=9.4.0",
    "typer>=0.15.1",
]

[project.urls]
Homepage = "https://github.com/PovertyAction/requests_to_twilio"
Repository = "https://github.com/PovertyAction/requests_to_twilio"
Issues = "https://github.com/PovertyAction/requests_to_twilio/issues"

[project.scripts]
rtt = "requests_to_twilio.cli:main"

[dependency-groups]
dev = [
    "codespell>=2.4.1",
    "pre-commit>=4.2.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/requests_to_twilio"]

[tool.ruff]
line-length = 88
fix = true
# Assume Python 3.12
target-version = "py312"

[tool.ruff.lint]
# docs: https://docs.astral.sh/ruff/rules/
select = [
    "F",   # Pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort
    "D",   # flake8-docstrings
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "S",   # flake8-bandit
]

ignore = [
    # do not enable if formatting
    # docs: https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",   # tab indentation
    "E111",   # indentation
    "E114",   # indentation
    "E117",   # over indented
    "D206",   # indent with spaces
    "D300",   # triple single quotes
    "E501",   # line length regulated by formatter
    "D105",   # missing docstring in magic method
    "D100",   # missing docstring in public module
    "D104",   # missing docstring in public package
    "SIM110", # Use all instead of `for` loop
    "TRY003", # Avoid specifying long messages outside the exception class
    "D205",   # 1 blank line required between summary line and description
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use assert and hard-coded throwaway keys. Test names are
# the documentation, so docstrings are not required on every case.
"tests/*" = ["S101", "S105", "S106", "D101", "D102", "D103"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 88

[tool.codespell]
builtin = "clear,rare,informal,usage,code,names"
# Most of these are Spanish words in the demo flow's language table, which lives
# in a script whose English docstrings are worth spell-checking, so they are
# ignored by word rather than by skipping the file. `deque` is not a typo for
# `dequeue`; it is `collections.deque`. If this list keeps growing, move the
# language tables out into data files and skip the Spanish one, the way
# templates/ and flows/ are skipped below.
ignore-words-list = "jupyter,ipa,keypair,master,momento,varios,que,responde,te,ser,deque"
# flows/ holds definitions fetched from Twilio, .claude/ quotes approved template
# copy verbatim, and templates/ carries the respondent-facing message text
# itself - including the Spanish half of the bilingual demo. All are records of
# what was or will be sent, not prose we author, so spell-checking them only
# produces false positives on ordinary Spanish words. markdownlint is excluded
# from .claude/ for the same reason.
skip = "uv.lock,*.js,flows/*,.claude/*,templates/generated/*,templates/*_es.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "node: requires a local Node.js runtime for cross-language interop checks",
]
