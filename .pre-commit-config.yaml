repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
        exclude: ^\.devcontainer/devcontainer\.json$
      - id: check-toml
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
      # This repo handles PII. Block the private-key shape outright.
      - id: detect-private-key
        stages: [pre-commit]

  # NOTE: broad secret scanning (gitleaks) deliberately does NOT run here.
  # IPA-managed Windows machines block the downloaded gitleaks binary under
  # Application Control policy (WinError 4551), which would leave every local
  # commit failing on an error nobody can fix. It runs in CI instead - see the
  # `secret-scan` job in .github/workflows/tests.yml - on a Linux runner where
  # no such policy applies. `detect-private-key` above is pure Python and does
  # catch the specific mistake this repository made before: a PEM key in source.

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        exclude: ^\.claude/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        types_or: [python, pyi]
