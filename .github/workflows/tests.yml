name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  # Runs here rather than as a pre-commit hook: IPA-managed Windows machines
  # block the gitleaks binary under Application Control policy, so a local hook
  # would fail for everyone. This repository has shipped a live Google
  # service-account key before, so the check is worth keeping somewhere.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Field staff run this on Windows; CI has to cover that.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Node
        # The encryption helper that runs inside Twilio Functions is JavaScript.
        # The interop test proves Node-encrypted payloads decrypt in Python.
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync uv
        run: uv sync --locked --dev
      - name: Run tests
        run: uv run pytest -v
